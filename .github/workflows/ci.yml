name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (type-checks and builds the UI)
        run: docker build -f app/Dockerfile -t datahub-connector-logs .
      - name: Run checks
        run: docker run --rm -e DATABASE_URL=x datahub-connector-logs python tests.py
