services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    ports: ["8000:8000"]
    env_file: .env
    environment:
      # compose also reads DATABASE_URL from .env, so pointing at Aiven PG needs no edit here
      DATABASE_URL: ${DATABASE_URL:-postgresql://datahub:${POSTGRES_PASSWORD:-datahub}@db:5432/datahublogs}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 30s

  # Postgres for the app's state. To use an existing/managed Postgres instead (e.g. on Aiven), delete this
  # service and the app's depends_on, and set DATABASE_URL.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: datahub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datahub}
      POSTGRES_DB: datahublogs
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datahub -d datahublogs"]
      interval: 5s
      retries: 10

volumes:
  pg-data:
