services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    ports: ["8000:8000"]
    env_file: .env
    environment:
      # compose also reads DATABASE_URL from .env, so pointing at Aiven PG needs no edit here
      DATABASE_URL: ${DATABASE_URL:-postgresql://datahub:${POSTGRES_PASSWORD:-datahub}@db:5432/datahublogs}
    volumes:
      - ./certs:/certs:ro  # local dev only; on Aiven pass the KAFKA_* values as PEM text instead
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 30s

  # Skip this service when DATABASE_URL points at an external Postgres (e.g. Aiven)
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: datahub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datahub}
      POSTGRES_DB: datahublogs
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datahub -d datahublogs"]
      interval: 5s
      retries: 10

  # Optional local Kafka, only for trying the Kafka destination:  docker compose --profile dev up -d
  # then add a destination with bootstrap "kafka:9092", security PLAINTEXT.
  kafka:
    profiles: [dev]
    image: apache/kafka:3.9.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MESSAGE_MAX_BYTES: 8388608
      KAFKA_REPLICA_FETCH_MAX_BYTES: 8388608

volumes:
  pg-data:
